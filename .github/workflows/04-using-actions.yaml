name: 04 - Using Actions

on: workflow_dispatch

jobs: 
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/react-app  
        steps:
            - name: Checkout Code 
              uses: actions/checkout@v7
            
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: "22.x"
            - name: install Dependencies
              run: npm ci    